name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    # packages/db's integration tests exercise all three supported dialects (doc 12 Phase
    # 3 DoD). SQLite needs no service — it's a file. Postgres and MySQL run as service
    # containers here; docker-compose.test.yml is the equivalent for local development.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_ADMIN_URL: postgres://postgres:test@localhost:5432/postgres
      MYSQL_ADMIN_URL: mysql://root:test@localhost:3306/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
